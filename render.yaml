# Render Infrastructure as Code Configuration
# Production-grade deployment configuration for AI Prompt Governance Engine
# Using Native Python environment, connected to Neon PostgreSQL, Upstash Redis, and Qdrant Cloud.

services:
  - type: web
    name: prompt-governance-engine
    env: python
    buildCommand: "./render-build.sh"
    startCommand: "./start.sh"
    plan: free # Can be upgraded to standard/pro for production scale
    region: oregon # Render's default region
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AWS_SECRETS_ENABLED
        value: "false"
      - key: WORKERS
        value: "4"
