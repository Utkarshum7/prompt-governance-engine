# Render Infrastructure as Code Configuration
# Production-grade deployment configuration for AI Prompt Governance Engine
# Using Native Python environment, connected to Neon PostgreSQL, Upstash Redis, and Qdrant Cloud.

services:
  - type: web
    name: prompt-governance-engine
    env: python
    buildCommand: "./render-build.sh"
    startCommand: "./start.sh"
    plan: free # Can be upgraded to standard/pro for production scale
    region: oregon # Render's default region
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AWS_SECRETS_ENABLED
        value: "false"
      - key: WORKERS
        # Kept low for the free plan's ~512MB RAM and to bound total Postgres
        # connections (pool_size=20 + max_overflow=10 per worker on Neon).
        # The scheduler leadership lock makes >1 worker safe correctness-wise;
        # this value is about memory/connection headroom, not correctness.
        # Raise if upgrading to a paid Render plan with more RAM.
        value: "2"
